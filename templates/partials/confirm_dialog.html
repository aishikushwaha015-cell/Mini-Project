<dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="confirm-body">
    <h2 id="confirm-title">Please confirm</h2>
    <p id="confirm-message">This action cannot be undone.</p>
  </div>
  <div class="confirm-actions">
    <button class="btn btn-ghost" id="confirm-cancel" type="button">Cancel</button>
    <button class="btn btn-danger" id="confirm-accept" type="button">Confirm</button>
  </div>
</dialog>
